name: atm-supabase
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "3"
services:
  api:
    <<: *hardening
    build: backend
    env_file: .runtime/local-demo.env
    secrets: [ATM_DATABASE_URL, ATM_SCORING_TOKEN]
    volumes:
      - ./.runtime/supabase-ca.pem:/run/secrets/supabase-ca.pem:ro
    tmpfs: [/tmp]
    networks: [services, egress]
    mem_limit: 512m
    cpus: 2
    healthcheck:
      test: [CMD, python, -m, atm_backend.healthcheck, api]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
  worker:
    <<: *hardening
    build: backend
    env_file: .runtime/local-demo.env
    secrets: [ATM_DATABASE_URL, ATM_SCORING_TOKEN]
    command: [python, -m, atm_backend.worker]
    volumes:
      - ./.runtime/supabase-ca.pem:/run/secrets/supabase-ca.pem:ro
    tmpfs: [/tmp]
    networks: [services, egress]
    mem_limit: 512m
    cpus: 2
    healthcheck:
      test: [CMD, python, -m, atm_backend.healthcheck, worker]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 45s
  gateway:
    <<: *hardening
    build:
      context: backend/deploy
      dockerfile: Dockerfile.gateway
    user: "10001:10001"
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9443:9443"
    volumes:
      - ./backend/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./backend/deploy/monitor:/srv/monitor:ro
      - ./frontend/dist:/srv/app:ro
    secrets: [local_cert, local_key, monitor_auth]
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700
      - /config:uid=10001,gid=10001,mode=0700
      - /tmp
    networks: [services, edge]
    mem_limit: 128m
    cpus: 1
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /run/secrets/local_cert, "https://localhost:8443/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
      prometheus:
        condition: service_started
  prometheus:
    <<: *hardening
    build:
      context: backend/deploy
      dockerfile: Dockerfile.monitor
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=256MB
      - --web.external-url=https://localhost:9443
      - --query.max-concurrency=4
      - --query.timeout=10s
    volumes:
      - ./backend/deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./backend/deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - monitoring:/prometheus
    networks: [services]
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  services:
    internal: true
  egress: {}
  edge: {}
volumes:
  monitoring: {}
secrets:
  ATM_DATABASE_URL:
    file: .runtime/secrets/ATM_DATABASE_URL
  ATM_SCORING_TOKEN:
    file: .runtime/secrets/ATM_SCORING_TOKEN
  local_cert:
    file: .runtime/localhost.pem
  local_key:
    file: .runtime/localhost-key.pem
  monitor_auth:
    file: .runtime/monitor-auth.caddy
